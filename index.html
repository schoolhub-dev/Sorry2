<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Полезные ископаемые — 7 класс</title>
<style>
:root{
  --bg:#070a11;
  --bg2:#0c1220;
  --panel:#131b2c;
  --panel2:#182238;
  --line:#26314a;
  --line2:#33405e;
  --text:#e9eefb;
  --muted:#9caecb;
  --dim:#75879f;
  --accent:#5aa2ff;
  --accent2:#7ce3d4;
  --radius:18px;
  --shadow:0 24px 70px rgba(0,0,0,.55);
  --font:"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --fs:clamp(13.5px,0.82vh + 0.34vw + 4.4px,19px);
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;height:100%;overflow:hidden}
body{
  margin:0;
  height:100%;
  overscroll-behavior-y:none;
  font-family:var(--font);
  font-size:var(--fs);
  line-height:1.5;
  color:var(--text);
  background:
    radial-gradient(1100px 700px at 12% -10%,rgba(90,162,255,.16),transparent 60%),
    radial-gradient(900px 620px at 100% 0%,rgba(124,227,212,.12),transparent 55%),
    radial-gradient(800px 700px at 50% 120%,rgba(167,139,250,.12),transparent 60%),
    linear-gradient(180deg,var(--bg2),var(--bg) 70%);
  background-attachment:fixed;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
[data-tone="blue"]{--c1:#4b8dfb;--c2:#0c2a63;--ac:#4b8dfb;--soft:rgba(75,141,251,.14);--ink:#cfe0ff}
[data-tone="cyan"]{--c1:#31d6e8;--c2:#073a4c;--ac:#31d6e8;--soft:rgba(49,214,232,.14);--ink:#cdf5fa}
[data-tone="green"]{--c1:#3ddc9a;--c2:#0a3a2c;--ac:#3ddc9a;--soft:rgba(61,220,154,.14);--ink:#cdf6e5}
[data-tone="amber"]{--c1:#ffc046;--c2:#5a3607;--ac:#ffc046;--soft:rgba(255,192,70,.14);--ink:#ffe9bd}
[data-tone="orange"]{--c1:#ff7a8a;--c2:#4d1226;--ac:#ff7a8a;--soft:rgba(255,122,138,.14);--ink:#ffd7dd}
[data-tone="violet"]{--c1:#a78bfa;--c2:#2e1a66;--ac:#a78bfa;--soft:rgba(167,139,250,.14);--ink:#e2d9ff}
[data-tone="slate"]{--c1:#93a7c4;--c2:#1e2938;--ac:#93a7c4;--soft:rgba(147,167,196,.14);--ink:#dfe8f5}
@supports (height:100dvh){body{height:100dvh}}

.appbar{
  flex:0 0 auto;
  display:flex;align-items:center;gap:1rem;
  padding:.65rem clamp(.8rem,2vw,1.6rem);
  border-bottom:1px solid rgba(255,255,255,.07);
  background:rgba(8,12,20,.72);
  backdrop-filter:blur(10px);
  position:relative;z-index:5;
}
.brand{display:flex;align-items:center;gap:.65rem;min-width:0}
.brand-mark{
  width:34px;height:34px;flex:0 0 auto;border-radius:11px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;color:#06121f;font-weight:800;font-size:.95rem;
  box-shadow:0 6px 18px rgba(90,162,255,.35);
}
.brand-text{min-width:0}
.brand-title{font-weight:700;font-size:.95rem;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:.74rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1 1 auto}
.btn{
  font:inherit;font-size:.82rem;font-weight:600;
  color:var(--text);background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line2);border-radius:11px;
  padding:.5rem .85rem;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:.45rem;
  transition:transform .12s ease,border-color .2s ease,background .2s ease;
}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),#3f6fe0);
  border-color:transparent;color:#05101f;box-shadow:0 8px 22px rgba(90,162,255,.3)
}
.btn-primary:hover{filter:brightness(1.07)}
.btn[aria-pressed="true"]{border-color:var(--accent2);color:var(--accent2)}

.deck{
  flex:1 1 auto;position:relative;min-height:0;
  padding:clamp(.7rem,1.6vw,1.5rem) clamp(.7rem,2.2vw,2rem);
  display:flex;
  overflow:hidden;
}
.stage{position:relative;flex:1 1 auto;min-width:0;display:flex;touch-action:pan-y;overflow:hidden}
.slide{
  display:none;
  position:relative;
  flex:1 1 auto;
  width:100%;
  min-height:0;
  flex-direction:column;
  gap:clamp(.7rem,1.4vh,1.2rem);
  padding:clamp(1.1rem,2.4vw,2.4rem);
  background:
    linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%),
    linear-gradient(180deg,var(--panel),#0f1626);
  border:1px solid var(--line);
  border-radius:calc(var(--radius) + 6px);
  box-shadow:var(--shadow);
  overflow:auto;
  scrollbar-width:thin;scrollbar-color:var(--line2) transparent;
}
.slide::-webkit-scrollbar{width:9px;height:9px}
.slide::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
.slide.is-active{display:flex}
.slide.enter-next{animation:enterNext .42s cubic-bezier(.22,.8,.3,1) both}
.slide.enter-prev{animation:enterPrev .42s cubic-bezier(.22,.8,.3,1) both}
@keyframes enterNext{from{opacity:0;transform:translateX(3.5%) scale(.985)}to{opacity:1;transform:none}}
@keyframes enterPrev{from{opacity:0;transform:translateX(-3.5%) scale(.985)}to{opacity:1;transform:none}}
.slide::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--t-c,var(--accent)),transparent);
}

.slide-head{display:flex;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.head-main{min-width:0;flex:1 1 340px}
.kicker{
  display:inline-flex;align-items:center;gap:.5rem;
  font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--k,var(--accent));
  margin-bottom:.4rem;
}
.kicker::before{content:"";width:22px;height:2px;border-radius:2px;background:currentColor;opacity:.7}
h1,h2,h3{margin:0;line-height:1.14;letter-spacing:-.01em}
h2{font-size:clamp(1.25rem,2.1vw,2.15rem)}
.slide-num{
  font-size:clamp(1.6rem,3vw,2.6rem);font-weight:800;color:rgba(255,255,255,.13);
  line-height:1;letter-spacing:-.02em
}
.lead{margin:.45rem 0 0;color:var(--muted);font-size:.95rem;max-width:70ch}

.body{flex:1 1 auto;display:grid;gap:clamp(.7rem,1.4vw,1.15rem);min-height:0;align-items:start}
.layout-side{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.layout-stack{grid-template-columns:minmax(0,1fr)}
.layout-hero{grid-template-columns:minmax(0,1fr)}
.layout-compare{grid-template-columns:repeat(2,minmax(0,1fr))}
.col{display:flex;flex-direction:column;gap:clamp(.55rem,1.1vh,.9rem);min-width:0}

.cards{display:grid;gap:clamp(.5rem,.9vh,.75rem)}
.cards.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.cards.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
  border:1px solid var(--line);
  border-left:3px solid var(--ac,var(--accent));
  border-radius:13px;
  padding:.6rem .8rem;
}
.card h3{font-size:.94rem;color:var(--ink,#fff);margin-bottom:.2rem}
.card p{margin:0;font-size:.86rem;color:var(--muted);line-height:1.45}
.card ul{margin:.15rem 0 0;padding-left:1.05rem;font-size:.85rem;color:var(--muted)}
.card li{margin:.12rem 0}
.card li::marker{color:var(--ac,var(--accent))}

.facts{display:flex;flex-wrap:wrap;gap:.45rem}
.fact{
  display:flex;flex-direction:column;gap:.05rem;
  background:rgba(255,255,255,.035);border:1px dashed var(--line2);
  border-radius:11px;padding:.4rem .6rem;min-width:6.5rem;flex:1 1 6.5rem
}
.fact b{font-size:.95rem;color:var(--k,var(--accent));letter-spacing:-.01em}
.fact span{font-size:.72rem;color:var(--dim);line-height:1.3}

.tasks{
  background:linear-gradient(180deg,rgba(255,192,70,.09),rgba(255,192,70,.02));
  border:1px solid rgba(255,192,70,.32);border-radius:13px;padding:.65rem .85rem
}
.tasks h3{font-size:.92rem;color:#ffd88a;margin-bottom:.35rem}
.tasks ol{margin:0;padding-left:1.25rem;font-size:.85rem;color:var(--muted)}
.tasks li{margin:.18rem 0}

.figs{display:grid;gap:clamp(.5rem,.9vw,.8rem);align-items:stretch}
.layout-stack .figs,.layout-hero .figs{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.layout-side .figs{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr}
.fig{margin:0;display:flex;flex-direction:column;gap:.3rem;min-width:0;height:100%}
.fig-box{
  position:relative;overflow:hidden;
  flex:1 1 auto;
  min-height:clamp(78px,15vh,150px);
  max-height:clamp(110px,27vh,220px);
  border-radius:14px;
  border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(135deg,var(--c1,#4b8dfb),var(--c2,#0c2a63));
  display:grid;place-items:center;
}
.fig-box::after{
  content:"";position:absolute;inset:0;
  background:
    repeating-linear-gradient(135deg,rgba(255,255,255,.10) 0 2px,transparent 2px 12px),
    radial-gradient(circle at 78% 18%,rgba(255,255,255,.28),transparent 55%);
}
.fig-box::before{
  content:"";position:absolute;inset:9px;border:2px dashed rgba(255,255,255,.34);border-radius:9px
}
.fig-label{
  position:relative;z-index:1;text-align:center;
  font-size:clamp(.78rem,1.1vw,1.02rem);font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.55);
  padding:.3rem 1.2rem
}
.fig-cap{font-size:.78rem;color:var(--dim);line-height:1.35}

.panels{display:contents}
.panel{
  display:flex;flex-direction:column;gap:.55rem;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
  border:1px solid var(--line);border-top:3px solid var(--ac,var(--accent));
  border-radius:15px;padding:.8rem .9rem
}
.panel-head{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.panel-head h3{font-size:1.02rem;color:var(--ink,#fff)}
.tag{
  font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:.15rem .5rem;border-radius:99px;
  background:var(--soft,rgba(255,255,255,.1));color:var(--ac,var(--accent));
  border:1px solid rgba(255,255,255,.18)
}
.panel ul{margin:0;padding-left:1.05rem;font-size:.85rem;color:var(--muted)}
.panel li{margin:.2rem 0}
.panel li::marker{color:var(--ac,var(--accent))}

.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{
  font-size:.76rem;color:var(--muted);
  background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:99px;padding:.25rem .6rem
}
.note{margin:0;font-size:.76rem;color:var(--dim);font-style:italic}

.hero{
  flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;gap:.9rem;
  text-align:center;align-items:center
}
.hero .lead{max-width:62ch;margin-inline:auto;font-size:1rem}
h1.hero-title{
  font-size:clamp(1.7rem,4.3vw,3.9rem);
  background:linear-gradient(120deg,#ffffff,var(--accent2) 55%,var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  max-width:22ch
}
.hero-line{width:min(420px,70%);height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.hero-meta{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.badge{
  font-size:.74rem;color:var(--accent2);background:rgba(124,227,212,.08);
  border:1px solid rgba(124,227,212,.3);border-radius:99px;padding:.28rem .7rem
}

.navbar{
  flex:0 0 auto;
  display:flex;align-items:center;gap:clamp(.5rem,1.6vw,1.2rem);
  padding:.55rem clamp(.8rem,2vw,1.6rem);
  border-top:1px solid rgba(255,255,255,.07);
  background:rgba(8,12,20,.75);backdrop-filter:blur(10px);
}
.nav-btn{
  width:42px;height:42px;flex:0 0 auto;border-radius:13px;
  display:grid;place-items:center;font-size:1.1rem;
  color:var(--text);background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line2);cursor:pointer;
  transition:transform .12s ease,border-color .2s ease,opacity .2s ease
}
.nav-btn:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.nav-btn:disabled{opacity:.32;cursor:not-allowed}
.dots{display:flex;align-items:center;gap:.35rem;flex:1 1 auto;justify-content:center;flex-wrap:wrap}
.dot{
  width:11px;height:11px;padding:0;border-radius:50%;
  border:1px solid var(--line2);background:rgba(255,255,255,.1);cursor:pointer;
  transition:all .2s ease
}
.dot:hover{background:rgba(255,255,255,.25)}
.dot.on{width:26px;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-color:transparent}
.counter{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted);white-space:nowrap}
.counter b{color:var(--text);font-size:1rem}
.hint{font-size:.74rem;color:var(--dim);white-space:nowrap}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .35s ease;border-radius:0 2px 2px 0}

.toast{
  position:fixed;left:50%;bottom:88px;transform:translate(-50%,16px);
  background:rgba(19,27,44,.96);border:1px solid var(--line2);border-radius:12px;
  padding:.6rem 1rem;font-size:.82rem;color:var(--text);box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:20;max-width:90vw
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.term{
  font-family:inherit;font-size:inherit;line-height:inherit;font-weight:inherit;
  font-style:italic;color:inherit;background:none;border:0;padding:0;cursor:pointer;
  border-bottom:1.5px dotted color-mix(in srgb,var(--k,var(--accent)) 60%,transparent);
  text-decoration:none;transition:background .18s ease,color .18s ease;
  border-radius:3px
}
.term:hover,.term:focus-visible,.term.on{background:var(--soft,rgba(90,162,255,.16));color:var(--ink,#fff);outline:none}
.term:active{transform:translateY(.5px)}

.pop{
  position:fixed;z-index:40;width:min(340px,calc(100vw - 24px));
  background:linear-gradient(180deg,#1a2440,#121a2c);
  border:1px solid var(--line2);border-radius:14px;
  box-shadow:0 22px 60px rgba(0,0,0,.6);
  padding:.7rem .8rem .75rem;
  opacity:0;transform:translateY(8px) scale(.97);pointer-events:none;
  transition:opacity .18s ease,transform .18s ease
}
.pop.on{opacity:1;transform:none;pointer-events:auto}
.pop::before{
  content:"";position:absolute;left:var(--ax,50%);top:-7px;width:12px;height:12px;
  transform:translateX(-50%) rotate(45deg);
  background:#1a2440;border-left:1px solid var(--line2);border-top:1px solid var(--line2)
}
.pop.below::before{top:auto;bottom:-7px;transform:translateX(-50%) rotate(225deg);border:0;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.pop-head{display:flex;align-items:flex-start;gap:.5rem;margin-bottom:.3rem}
.pop-head b{font-size:.98rem;color:var(--pc,var(--accent2))}
.pop-x{
  margin-left:auto;flex:0 0 auto;width:26px;height:26px;border-radius:8px;
  border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--muted);
  font-size:.9rem;line-height:1;cursor:pointer;display:grid;place-items:center
}
.pop-x:hover{color:#fff;border-color:var(--accent)}
.pop-body{margin:0;font-size:.86rem;color:var(--muted);line-height:1.45}
.pop-src{margin:.4rem 0 0;font-size:.68rem;color:var(--dim)}

.sheet{
  position:fixed;inset:0;z-index:50;display:none;
  background:rgba(4,7,13,.72);backdrop-filter:blur(6px);
  padding:clamp(.5rem,3vw,2rem)
}
.sheet.on{display:grid;place-items:center}
.sheet-box{
  width:min(760px,100%);max-height:86vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#18223a,#0f1626);
  border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);overflow:hidden
}
.sheet-head{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem;border-bottom:1px solid var(--line)}
.sheet-head h3{font-size:1.05rem}
.sheet-head .pop-x{margin-left:auto}
.sheet-search{
  padding:.55rem 1rem;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.03)
}
.sheet-search input{
  width:100%;font:inherit;font-size:.9rem;color:var(--text);
  background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:10px;padding:.5rem .65rem
}
.sheet-search input::placeholder{color:var(--dim)}
.sheet-list{overflow:auto;padding:.6rem 1rem 1rem;display:flex;flex-direction:column;gap:.4rem}
.gterm{padding:.5rem .65rem;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.03)}
.gterm b{display:block;font-size:.9rem;color:var(--accent2);margin-bottom:.15rem}
.gterm span{font-size:.82rem;color:var(--muted);line-height:1.4}
.gterm.hidden{display:none}

.tabs{display:flex;gap:.35rem;flex-wrap:wrap}
.tab{
  font:inherit;font-size:.8rem;font-weight:600;color:var(--muted);
  background:rgba(255,255,255,.04);border:1px solid var(--line2);
  border-radius:99px;padding:.3rem .75rem;cursor:pointer
}
.tab.on{background:var(--soft,rgba(90,162,255,.16));border-color:var(--ac,var(--accent));color:var(--ink,#fff)}
.mapbox{
  position:relative;min-height:clamp(190px,34vh,340px);
  border:1px solid var(--line2);border-radius:16px;overflow:hidden;
  background:
    radial-gradient(120% 90% at 50% 0%,rgba(90,162,255,.12),transparent 60%),
    linear-gradient(180deg,#111a2c,#0a111e)
}
.mapbox::after{
  content:"карта-схема";position:absolute;right:.5rem;bottom:.4rem;
  font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.22);
  pointer-events:none
}
.mapsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mapsvg .land{fill:#1d2c47;stroke:#31456b;stroke-width:1;stroke-linejoin:round}
.mapsvg .land-hi{fill:rgba(61,220,154,.20);stroke:#3ddc9a;stroke-width:1.6;stroke-linejoin:round}
.mapsvg .grid{fill:none;stroke:rgba(255,255,255,.07);stroke-width:1}
.mkLayer{position:absolute}
.mk{
  position:absolute;transform:translate(-50%,-50%);
  width:var(--d,15px);height:var(--d,15px);padding:0;border-radius:50%;
  border:2px solid #fff;background:var(--mc,var(--accent));cursor:pointer;
  box-shadow:0 0 0 4px color-mix(in srgb,var(--mc,var(--accent)) 26%,transparent);
  transition:transform .18s ease,box-shadow .18s ease
}
.mk::after{
  content:attr(data-l);position:absolute;left:50%;top:calc(100% + 7px);
  transform:translateX(-50%);white-space:nowrap;
  font-size:.7rem;font-weight:600;color:var(--text);
  text-shadow:0 1px 3px #05080f,0 0 8px #05080f
}
.mk[data-lp="t"]::after{top:auto;bottom:calc(100% + 7px)}
.mk[data-lp="l"]::after{left:auto;right:calc(100% + 8px);top:50%;transform:translateY(-50%)}
.mk[data-lp="r"]::after{left:calc(100% + 8px);top:50%;transform:translateY(-50%)}
.mk:hover{transform:translate(-50%,-50%) scale(1.18)}
.mk.on{transform:translate(-50%,-50%) scale(1.25);box-shadow:0 0 0 7px color-mix(in srgb,var(--mc,var(--accent)) 34%,transparent)}
.mapinfo{
  display:flex;flex-direction:column;gap:.4rem;
  border:1px solid var(--line);border-top:3px solid var(--ac,var(--accent));
  border-radius:14px;padding:.7rem .8rem;background:rgba(255,255,255,.035)
}
.mapinfo h3{font-size:1rem;color:var(--ink,#fff)}
.mapinfo p{margin:0;font-size:.85rem;color:var(--muted);line-height:1.45}
.mapinfo .res{display:flex;flex-wrap:wrap;gap:.3rem}
.mapinfo .res span{
  font-size:.72rem;padding:.18rem .5rem;border-radius:99px;

function toneOf(s){ return s.tone || "blue"; }

function cardHtml(c, tone){
  const t = c.tone || tone;
  const items = Array.isArray(c.items)
    ? "<ul>" + c.items.map(function(i){ return "<li>" + i + "</li>"; }).join("") + "</ul>"
    : "<p>" + c.d + "</p>";
  return '<article class="card" data-tone="' + t + '"><h3>' + c.t + "</h3>" + items + "</article>";
}

function figsHtml(list, tone){
  if (!list || !list.length) return "";
  return '<div class="figs">' + list.map(function(f){
    return '<figure class="fig" data-tone="' + (f.tone || tone) + '">' +
      '<div class="fig-box"><span class="fig-label">' + f.box + "</span></div>" +
      "<figcaption class=\"fig-cap\">" + f.cap + "</figcaption></figure>";
  }).join("") + "</div>";
}

function factsHtml(list, tone){
  if (!list || !list.length) return "";
  const real = list.filter(function(f){ return f.k; });
  if (!real.length) return "";
  return '<div class="facts" data-tone="' + tone + '">' + real.map(function(f){
    return '<div class="fact"><b>' + f.v + "</b><span>" + f.k + "</span></div>";
  }).join("") + "</div>";
}

function panelHtml(p){
  return '<section class="panel" data-tone="' + p.tone + '">' +
    '<div class="panel-head"><h3>' + p.title + '</h3><span class="tag">' + p.tag + "</span></div>" +
    "<ul>" + p.items.map(function(i){ return "<li>" + i + "</li>"; }).join("") + "</ul>" +
    figsHtml([p.figure], p.tone) +
    "</section>";
}

  return '<section class="slide" data-tone="' + tone + '" id="slide-' + (i + 1) + '"' +
    ' style="--t-c:var(--ac);--k:var(--ac)" role="group" aria-roledescription="слайд" aria-label="Слайд ' + (i + 1) + " из " + SLIDES.length + '">' +
    (s.layout === "hero" ? "" :
      '<div class="slide-head"><div class="head-main"><div class="kicker">' + s.kicker + "</div>" +
      "<h2>" + s.title + "</h2>" + (s.lead ? '<p class="lead">' + s.lead + "</p>" : "") +
      "</div><div class=\"slide-num\">" + String(i + 1).padStart(2, "0") + "</div></div>") +
    body + noteRow + "</section>";
}

const slideEls = Array.prototype.slice.call(stage.querySelectorAll(".slide"));
const dotEls = Array.prototype.slice.call(dotsBox.querySelectorAll(".dot"));

function go(n, d){
  const next = Math.max(0, Math.min(SLIDES.length - 1, n));
  dir = d === undefined ? (next >= idx ? 1 : -1) : d;
  idx = next;
  slideEls.forEach(function(el, i){
    el.classList.remove("enter-next", "enter-prev");
    if (i === idx) {
      el.classList.add("is-active", dir >= 0 ? "enter-next" : "enter-prev");
el.scrollTop = 0;
    } else {
      el.classList.remove("is-active");
    }
    el.setAttribute("aria-hidden", i === idx ? "false" : "true");
  });
  dotEls.forEach(function(d2, i){ d2.classList.toggle("on", i === idx); });
  elCur.textContent = idx + 1;
  elProgress.style.width = ((idx + 1) / SLIDES.length * 100) + "%";
  btnPrev.disabled = idx === 0;
  btnNext.disabled = idx === SLIDES.length - 1;
  try { history.replaceState(null, "", "#slide-" + (idx + 1)); } catch (err) {}
  if (mapReady && slideEls[idx].querySelector(".tab")) renderMap();
}

function next(){ if (idx < SLIDES.length - 1) go(idx + 1, 1); }
function prev(){ if (idx > 0) go(idx - 1, -1); }

btnNext.addEventListener("click", next);
btnPrev.addEventListener("click", prev);

  const b = e.target.closest(".dot");

document.addEventListener("keydown", function(e){
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (document.getElementById("sheet").classList.contains("on")) return;
  if (slideEls[idx].querySelector(".qlist")) return;
  const t = e.target;
  const onControl = t && t.closest && t.closest("button");
  const k = e.key;
  const isSpace = k === " " || k === "Spacebar" || k === "Enter";
  if ((k === "ArrowRight" || k === "ArrowDown" || k === "PageDown" || isSpace) && !(isSpace && onControl)) {
    e.preventDefault(); next();
  } else if (k === "ArrowLeft" || k === "ArrowUp" || k === "PageUp" || k === "Backspace") {
    e.preventDefault(); prev();
  } else if (k === "Home") {
    e.preventDefault(); go(0, -1);
  } else if (k === "End") {
    e.preventDefault(); go(SLIDES.length - 1, 1);
  } else if (k === "f" || k === "F" || k === "а" || k === "А") {
    toggleFull();
  } else if (k === "p" || k === "P" || k === "з" || k === "З") {
    e.preventDefault(); doPrint();
  }
});

let tX = 0, tY = 0, tT = 0, tSeen = false;
document.addEventListener("touchstart", function(e){
  if (e.touches.length !== 1) return;
  if (!tSeen) { tSeen = true; toast("Свайп влево / вправо — листать слайды"); }
  tX = e.touches[0].clientX; tY = e.touches[0].clientY; tT = e.touches[0].timeStamp;
}, { passive: true });

document.addEventListener("touchend", function(e){
  const t = e.changedTouches[0];
  const dx = t.clientX - tX;
  const dy = t.clientY - tY;
  const dt = t.timeStamp - tT;
  if (dt > 900 || Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
  if (dx < 0) next(); else prev();
}, { passive: true });

let wheelLock = false;
document.addEventListener("wheel", function(e){
  if (wheelLock) return;
  if (Math.abs(e.deltaY) < 28) return;
  const active = slideEls[idx];
  const atTop = active.scrollTop <= 0;
  const atBottom = active.scrollTop + active.clientHeight >= active.scrollHeight - 1;
  if (e.deltaY > 0 && atBottom) { wheelLock = true; next(); setTimeout(function(){ wheelLock = false; }, 520); }
  if (e.deltaY < 0 && atTop) { wheelLock = true; prev(); setTimeout(function(){ wheelLock = false; }, 520); }
}, { passive: true });

function toggleFull(){
  if (!document.fullscreenElement) {

}

/* ---------- 1. Подчёркнутые термины со словарём ---------- */
const FORM_MAP = {};
GLOSSARY.forEach(function(g, gi){
  g.f.forEach(function(f){ FORM_MAP[f.toLowerCase()] = gi; });
});
const TERM_RE = new RegExp("(^|[^0-9A-Za-zА-Яа-яЁё])(?:" + Object.keys(FORM_MAP)
  .sort(function(a, b){ return b.length - a.length; })
  .map(function(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); })
  .join("|") + ")(?![0-9A-Za-zА-Яа-яЁё])", "gi");

function linkTerms(root){
  root.querySelectorAll(".card, .panel, .lead, .note, .tasks, .fig-cap, .fig-label").forEach(function(scope){
    const texts = [];
    (function walk(n){
      Array.prototype.forEach.call(n.childNodes, function(c){
        if (c.nodeType === 3) texts.push(c);
        else if (c.nodeType === 1 && !c.classList.contains("term")) walk(c);
      });
    })(scope);
    texts.forEach(function(node){
      const txt = node.nodeValue;
      if (!txt || !/[А-Яа-я]/.test(txt)) return;
      let hits = 0;
      const out = txt.replace(TERM_RE, function(m2, pre){
        const word = m2.slice(pre.length);
        const gi = FORM_MAP[word.toLowerCase()];
        if (gi === undefined || hits >= 2) return m2;
        hits++;
        return pre + '<button class="term" type="button" data-g="' + gi +
          '" title="Показать определение">' + word + "</button>";
      });
      if (out !== txt){
        const span = document.createElement("span");
        span.innerHTML = out;
        node.parentNode.replaceChild(span, node);
      }
    });
  });
}
linkTerms(stage);

  const below = r.bottom + 14 + h <= window.innerHeight;
  pop.classList.toggle("below", !below);
  pop.style.left = left + "px";
  pop.style.top = Math.max(8, below ? r.bottom + 12 : r.top - h - 12) + "px";
  pop.style.setProperty("--ax", (r.left + r.width / 2 - left) + "px");
}

/* ---------- 3. Карта-схема ---------- */
const mapInfo = document.getElementById("mapInfo");
let mapId = MAPS[0].id;
mapReady = true;

function mapById(id){
  return MAPS.filter(function(x){ return x.id === id; })[0] || MAPS[0];
}
function mapEls(){
  return {
    box: document.getElementById("mapBox"),
    svg: document.getElementById("mapSvg"),
    layer: document.getElementById("mkLayer")
  };
}
function placeMap(){
  const el = mapEls();
  if (!el.box || !el.svg || !el.layer) return;
  const m = mapById(mapId);
  const box = el.box.getBoundingClientRect();
  if (!box.width || !box.height) return;
  const vw = 1000, vh = Math.round(vw * (m.box[2] - m.box[3]) / (m.box[1] - m.box[0]));
  el.svg.setAttribute("viewBox", "0 0 " + vw + " " + vh);
  const s = Math.min(box.width / vw, box.height / vh);
  const dw = vw * s, dh = vh * s;
  el.layer.style.left = ((box.width - dw) / 2) + "px";
  el.layer.style.top = ((box.height - dh) / 2) + "px";
  el.layer.style.width = dw + "px";
  el.layer.style.height = dh + "px";
}
function renderMap(){
  const el = mapEls();
  const mp = mapById(mapId);
  const lonW = mp.box[0], lonE = mp.box[1], latN = mp.box[2], latS = mp.box[3];
  el.svg.querySelector(".land").setAttribute("d", MAPSVG[mp.id].land);
  el.svg.querySelector(".land-hi").setAttribute("d", MAPSVG[mp.id].hi);
  el.layer.innerHTML = mp.pts.map(function(p, i){
    const x = (p.lo - lonW) / (lonE - lonW) * 100;
    const y = (latN - p.la) / (latN - latS) * 100;
    return '<button class="mk" type="button" data-i="' + i + '" data-lp="' + p.lp +
      '" data-l="' + (p.sh || p.n) + '" title="' + p.n + '" aria-label="' + p.n + '" style="left:' + x.toFixed(2) +
      "%;top:" + y.toFixed(2) + "%;--d:" + (9 + p.s * 2.4).toFixed(1) + "px;--mc:" + mp.c + '"></button>';
  }).join("");
  placeMap();
  const kinds = [];
  mp.pts.forEach(function(p){
    p.res.forEach(function(r){ if (kinds.indexOf(r) < 0) kinds.push(r); });
  });
  mapInfo.style.setProperty("--ac", mp.c);
  mapInfo.innerHTML = "<h3>" + mp.name + "</h3>" +
    "<p>" + mp.pts.length + " районов на схеме. Нажмите на точку — увидите, что там добывают.</p>" +
    '<div class="res">' + kinds.map(function(k){
      return "<span>" + k + "</span>";
    }).join("") + "</div>" +
    '<p class="tip">Размер точки — насколько богат район. Карта условная: нужна, чтобы запомнить главное, а не для точной географии.</p>';
}
function selectPt(i){
  const mp = mapById(mapId);
  const p = mp.pts[i];
  if (!p) return;
  const el = mapEls();
  el.layer.querySelectorAll(".mk").forEach(function(b, j){
    b.classList.toggle("on", j === i);
  });
  mapInfo.style.setProperty("--ac", mp.c);
  mapInfo.innerHTML = "<h3>" + p.n + "</h3><p>" + p.d + '</p><div class="res">' +
    p.res.map(function(r){ return "<span>" + r + "</span>"; }).join("") + "</div>" +
    '<p class="tip">' + mp.name + " · нажмите другую точку, чтобы сравнить</p>";
}
stage.addEventListener("click", function(e){
  const tab = e.target.closest(".tab");
  if (tab){
    mapId = tab.dataset.map;
    stage.querySelectorAll(".tab").forEach(function(t){
      const on = t === tab;
      t.classList.toggle("on", on);
      t.setAttribute("aria-selected", on ? "true" : "false");

/* ---------- 4. Мини-игра: один вопрос за раз ---------- */
const qScore = document.getElementById("qScore");
const qPos = document.getElementById("qPos");
const qStage = document.getElementById("qStage");
const qFinal = document.getElementById("qFinal");
const qDots = document.getElementById("qDots");
const qPrev = document.getElementById("qPrev");
const qNext = document.getElementById("qNext");
let qCur = 0;

function quizEls(){
  return {
    qs: qStage ? Array.prototype.slice.call(qStage.querySelectorAll(".q")) : [],
    dots: qDots ? Array.prototype.slice.call(qDots.querySelectorAll(".qdot")) : []
  };
}
function quizDone(){
  const el = quizEls();
  return el.qs.filter(function(q){ return q.dataset.done === "1"; }).length;
}
function quizOk(i){
  const el = quizEls();
  return !!el.qs[i] && el.qs[i].dataset.ok === "1";
}
function markGrade(i, ok){
  const el = quizEls();
  if (el.dots[i]) el.dots[i].classList.remove("ok", "no", "cur");
  if (el.qs[i] && el.qs[i].dataset.done === "1"){
    el.dots[i].classList.add(ok ? "ok" : "no");
  }
}
function quizFinal(){
  const el = quizEls();
  const answered = quizDone();
  const total = QUIZ.length;
  if (answered < total) return false;
  let ok = 0;
  const wrong = [];
  el.qs.forEach(function(q, i){
    if (q.dataset.done !== "1") return;
    if (quizOk(i)) ok++;
    else wrong.push("<li><b>" + String(i + 1) + ".</b> " + QUIZ[i].q + " — верно: " + QUIZ[i].a + "</li>");
  });
  const grade = ok === total ? "Отлично! Все ответы верные."
    : ok >= total * 0.7 ? "Хорошо! Ошибки стоит повторить."
    : ok >= total * 0.4 ? "Нормально, но есть пробелы — повторите тему."
    : "Стоит вернуться к слайдам и разобраться ещё раз.";
  if (qFinal){
    qFinal.hidden = false;
    qFinal.innerHTML = "<h3>Итог: " + ok + " из " + total + "</h3>" +
      '<p><span class="big">' + Math.round(ok / total * 100) + "%</span> — " + grade + "</p>" +
      (wrong.length ? "<p>Разбери ошибки:</p><ul>" + wrong.join("") + "</ul>" : "") +
      '<div class="qnav" style="margin-top:.5rem">' +
        '<button class="btn" id="qAgain" type="button"><span class="ic">&#8635;</span><span class="lbl">Пройти заново</span></button>' +
        '<button class="btn primary" id="qReview" type="button"><span class="lbl">Пересмотреть ответы</span><span class="ic">&#8594;</span></button>' +
      "</div>";
    const again = document.getElementById("qAgain");
    if (again) again.addEventListener("click", function(){ resetQuiz(); });
    const review = document.getElementById("qReview");
    if (review) review.addEventListener("click", function(){
      qFinal.hidden = true;
      showQ(firstWrong());
      toast("Разбери ошибки и попробуй ещё раз");
    });
  }
  return true;
}
function firstWrong(){
  const el = quizEls();
  for (let i = 0; i < el.qs.length; i++){
    if (el.qs[i].dataset.done !== "1" || !quizOk(i)) return i;
  }
  return 0;
}
function showQ(i){
  const el = quizEls();
  if (!el.qs.length) return;
  qCur = Math.max(0, Math.min(el.qs.length - 1, i));
  el.qs.forEach(function(q, j){
    q.hidden = j !== qCur;
  });
  el.dots.forEach(function(d, j){
    d.classList.toggle("on", j === qCur);
    d.classList.toggle("cur", j === qCur);
  });
  if (qPos) qPos.textContent = "Вопрос " + (qCur + 1) + " из " + QUIZ.length;
  if (qPrev) qPrev.disabled = qCur === 0;
  if (qNext){
    const last = qCur === QUIZ.length - 1;
    qNext.disabled = false;
    qNext.querySelector(".lbl").textContent = last ? "Итоги" : "Дальше";
  }
  if (qFinal && !quizFinal()) qFinal.hidden = true;
}
function goQ(i){
  const el = quizEls();
  if (!el.qs.length) return;
  const target = Math.max(0, Math.min(el.qs.length - 1, i));
  if (target > qCur || quizDone() === el.qs.length) showQ(target);
}
function nextQ(){
  if (qCur >= QUIZ.length - 1){ showQ(QUIZ.length - 1); return; }
  showQ(qCur + 1);
}
function prevQ(){ if (qCur > 0) showQ(qCur - 1); }

function scoreQuiz(){
  if (!qScore) return;
  const el = quizEls();
  let ok = 0;
  el.qs.forEach(function(q){
    if (q.dataset.ok === "1") ok++;
  });
  qScore.textContent = String(ok);
  if (el.dots.length) showQ(qCur);
}
stage.addEventListener("click", function(e){
  const dot = e.target.closest(".qdot");
  if (dot){
    showQ(Number(dot.dataset.i));
    return;
  }
  if (e.target.closest("#qPrev")){ prevQ(); return; }
  if (e.target.closest("#qNext")){ nextQ(); return; }
  const opt = e.target.closest(".opt");
  if (!opt) return;
  const q = opt.closest(".q");
  if (!q || q.dataset.done === "1") return;
  q.dataset.done = "1";
  q.querySelectorAll(".opt").forEach(function(b){
    b.disabled = true;
    if (b.dataset.ok === "1") b.classList.add("right");
  });
  const res = q.querySelector(".qres");
  const good = opt.dataset.ok === "1";
  q.dataset.ok = good ? "1" : "0";
  if (good){
    res.textContent = "Верно! +1 балл";
    res.className = "qres ok";
  } else {
    opt.classList.add("wrong");
    res.textContent = "Неверно. Правильный ответ отмечен зелёным.";
    res.className = "qres no";
  }
  markGrade(Number(q.dataset.i), good);
  scoreQuiz();
  const el = quizEls();
  if (el.qs.length && el.qs.every(function(x){ return x.dataset.done === "1"; })){
    qFinal.hidden = false;
    quizFinal();
  } else if (qNext){
    qNext.classList.add("pulse");
  }
});
function resetQuiz(){
  stage.querySelectorAll(".q").forEach(function(q){
    q.dataset.done = "0";
    q.dataset.ok = "";
    q.querySelectorAll(".opt").forEach(function(b){
      b.disabled = false;
      b.classList.remove("right", "wrong");
    });
    const res = q.querySelector(".qres");
    res.textContent = "";
    res.className = "qres";
  });
  quizEls().dots.forEach(function(d){ d.classList.remove("ok", "no"); });
  if (qFinal) qFinal.hidden = true;
  scoreQuiz();
  showQ(0);
  toast("Ответы сброшены — попробуйте ещё раз");
}
const qReset = document.getElementById("qReset");
if (qReset) qReset.addEventListener("click", resetQuiz);
showQ(0);
document.addEventListener("keydown", function(e){
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (!qStage || document.getElementById("sheet").classList.contains("on")) return;
  if (slideEls[idx].querySelector(".qlist") === null) return;
  if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === "Enter" || e.key === " "){
    if (e.target && e.target.closest && e.target.closest("button, input, textarea")) {
      if (e.key !== "ArrowRight" && e.key !== "ArrowDown") return;
    }
    e.preventDefault();
    nextQ();
  } else if (e.key === "ArrowLeft" || e.key === "ArrowUp"){
    e.preventDefault();
    prevQ();
  } else if (/^[1-3]$/.test(e.key)){
    const opt = qStage.querySelectorAll(".q")[qCur].querySelectorAll(".opt")[Number(e.key) - 1];
    if (opt && !opt.disabled){ e.preventDefault(); opt.click(); }
  }
});

/* ---------- 5. Общее ---------- */
document.addEventListener("keydown", function(e){
  if (e.key !== "Escape") return;
  if (sheet.classList.contains("on")) closeSheet();
  else closePop();
});
setTimeout(function(){
  toast("Подчёркнутые слова — словарь: нажмите на термин, чтобы увидеть определение");
}, 1200);
</script>
